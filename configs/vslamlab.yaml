# VSLAM-LAB defaults for Refrax (consumed by vslamlab_refrax.py, VSLAM-LAB's 'pixi run refrax-inference').
# Only the physical/correction settings live here: the camera comes from each sequence's calibration.yaml and the
# frames from its rgb.csv, so there are no camera:/paths: blocks and this file is not a complete config for
# remove_refraction.py (use dataset.yaml as the template for that). Every value can be overridden per run
# (--z0, --mu-w, --crop, ...).

housing:              # flat-port housing, camera frame
  n_port: [0.0, 0.0, 1.0]   # port normal
  mu_a: 1.0                 # refractive index: air
  mu_g: 1.47                # refractive index: port glass
  mu_w: 1.34                # refractive index: water
  rflat: 0.02               # camera centre -> port distance (m)
  tglass: 0.002             # port glass thickness (m)

correction:
  z0_fixed: 1.0             # scene depth (m) the correction map is built for
  fit_canvas: true          # size the output to hold the whole corrected image (principal point shifts accordingly);
                            # false = clip to the source W x H (Refrax's own behaviour, pair with --zoom in-bounds)
  crop_valid_bbox: false    # crop outputs to the largest all-valid rectangle (no black borders)
